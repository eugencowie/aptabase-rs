[tools]
actionlint = "latest"
gh = "latest"
git-cliff = "latest"
node = "latest"
"npm:@fission-ai/openspec" = "latest"
release-plz = "latest"
rust = "stable"

[tasks]
format = "cargo fmt"
lint = "cargo clippy --all-targets"
test = "cargo test"
changelog = "git cliff --bump"
release = "release-plz update"

[tasks.ci]
depends = ["format --check", "lint", "test"]
