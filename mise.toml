[tools]
actionlint = "latest"
gh = "latest"
git-cliff = "latest"
release-plz = "latest"
rust = "stable"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks.format]
description = "Fix formatting issues"
run = "cargo fmt"

[tasks.lint]
description = "Fix linting issues"
run = "cargo clippy --all-targets --fix --allow-dirty"

[tasks.check]
description = "Check formatting/linting/tests"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets",
  "cargo test"
]

[tasks.changelog]
description = "Update changelog"
run = "git cliff --bump"

[tasks.release]
description = "Update release versions and changelogs locally"
run = "release-plz update"
