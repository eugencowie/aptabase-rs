[package]
name = "aptabase-rs"
version = "0.1.0"
authors = ["Eugén Cowie"]
edition = "2024"
description = "Rust SDK for Aptabase: Open Source, Privacy-First and Simple Analytics for Mobile, Desktop and Web Apps"
homepage = "https://github.com/eugencowie/aptabase-rs"
repository = "https://github.com/eugencowie/aptabase-rs"
license = "MIT"
keywords = ["analytics", "aptabase", "telemetry"]
categories = ["api-bindings"]

[dependencies]
tokio = "1.43.0"
futures = "0.3.31"
serde = "1.0.217"
serde_json = "1.0.138"
reqwest = { version = "0.12.12", features = ["json"] }
time = { version = "0.3.37", features = ["formatting"] }
os_info = "3.9.2"
rand = "0.9.0"
log = "0.4.25"
sys-locale = "0.3.2"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
