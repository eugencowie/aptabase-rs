name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_TASK_RUN_AUTO_INSTALL: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@v5.2.6
        with:
          install_args: rust mr-boxington jactionlint shellcheck

      - name: Set up build cache
        uses: jdx/mr-boxington-action@v1.7.3

      - name: Run checks
        run: mise run check

  check-example:
    name: Check example
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@v5.2.6
        with:
          install_args: rust mr-boxington

      - name: Set up build cache
        uses: jdx/mr-boxington-action@v1.7.3
        with:
          working-directory: examples/helloworld
          cache-generation: example-v1

      - name: Run checks
        run: mise run example:check
